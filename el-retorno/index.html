<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b1a">
<meta name="description" content="El Retorno: ayuda a Nico a volver a casa una noche en la que la ciudad se ha vuelto loca. Roguelike pixel art de minijuegos.">
<meta property="og:title" content="El Retorno">
<meta property="og:description" content="Una noche cualquiera. Una ciudad cualquiera. Zombis, vampiros, un volcán en la avenida... y tu madre esperando.">
<title>El Retorno</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%230b0b1a'/%3E%3Crect x='2' y='1' width='4' height='3' fill='%23291814'/%3E%3Crect x='3' y='3' width='3' height='2' fill='%23ffccaa'/%3E%3Crect x='2' y='5' width='4' height='2' fill='%23ff004d'/%3E%3Crect x='6' y='1' width='1' height='1' fill='%23fff1e8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="screen" width="320" height="180" aria-label="El Retorno"></canvas>
  </div>
  <div id="pad">
    <div id="dpad" aria-hidden="true"><span class="u"></span><span class="d"></span><span class="l"></span><span class="r"></span><i></i></div>
    <div id="mid">
      <button id="btn-pause" class="mini" aria-label="Pausa">II</button>
      <button id="btn-mute" class="mini" aria-label="Sonido">♪</button>
    </div>
    <div id="ab">
      <button class="btn b" data-k="b">B</button>
      <button class="btn a" data-k="a">A</button>
    </div>
  </div>
</div>
<noscript>Necesitas JavaScript para jugar a El Retorno.</noscript>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/data.js"></script>
<script src="js/games/common.js"></script>
<script src="js/games/zombis.js"></script>
<script src="js/games/vampiro.js"></script>
<script src="js/games/volcan.js"></script>
<script src="js/games/encierro.js"></script>
<script src="js/games/meiga.js"></script>
<script src="js/games/fantasmas.js"></script>
<script src="js/games/tuna.js"></script>
<script src="js/games/compana.js"></script>
<script src="js/games/tejados.js"></script>
<script src="js/games/coco.js"></script>
<script src="js/scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
