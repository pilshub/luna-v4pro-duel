<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug Hunt</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; overflow-x: hidden; }
body {
  font-family: system-ui, 'Segoe UI', Arial, sans-serif;
  background: #111;
  color: #eee;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  min-height: 100vh;
}
h1 { font-size: 1.6rem; margin-bottom: 8px; letter-spacing: 0.04em; }
.controls { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
button {
  padding: 10px 22px;
  font-size: 1rem;
  font-weight: 600;
  border: 2px solid #555;
  border-radius: 6px;
  cursor: pointer;
  background: #333;
  color: #eee;
  transition: background 0.15s, border-color 0.15s;
  min-width: 44px;
  min-height: 44px;
}
button:hover { background: #444; border-color: #888; }
button:focus-visible { outline: 3px solid #4ff; outline-offset: 2px; }
button:active { background: #555; }
#score-display { font-size: 1.1rem; min-width: 100px; text-align: center; }
#score-display span { color: #fd5; font-weight: bold; font-size: 1.3rem; }
.best { font-size: 0.85rem; color: #aaa; margin-left: 12px; }
#stage {
  position: relative;
  width: 100%;
  max-width: 780px;
  aspect-ratio: 780 / 420;
  background: #1a1a2e;
  border: 2px solid #333;
  border-radius: 8px;
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#stage::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(255,255,255,0.02) 0%, transparent 70%);
  pointer-events: none;
}
.player, .enemy, .spark {
  position: absolute;
  border-radius: 4px;
  will-change: left, top;
}
.player {
  width: 34px; height: 34px;
  background: #4ff;
  box-shadow: 0 0 14px rgba(68,255,255,0.6);
  border-radius: 6px;
  z-index: 3;
  transition: box-shadow 0.15s;
}
.player.hit { box-shadow: 0 0 28px rgba(255,68,85,0.9); background: #f45; }
.enemy {
  width: 40px; height: 40px;
  background: #f45;
  box-shadow: 0 0 16px rgba(255,68,85,0.5);
  border-radius: 6px;
  z-index: 2;
}
.spark {
  width: 18px; height: 18px;
  background: #fd5;
  box-shadow: 0 0 10px rgba(255,221,85,0.7);
  border-radius: 50%;
  z-index: 1;
  animation: spark-pulse 0.8s ease-in-out infinite alternate;
}
@keyframes spark-pulse { from { box-shadow: 0 0 6px rgba(255,221,85,0.4); } to { box-shadow: 0 0 18px rgba(255,221,85,0.9); } }
#result {
  margin-top: 10px;
  font-size: 1.2rem;
  font-weight: bold;
  min-height: 28px;
  text-align: center;
}
#result.win { color: #5f8; }
#result.lose { color: #f54; }
.mobile-hint { display: none; font-size: 0.8rem; color: #777; margin-top: 4px; text-align: center; }
@media (max-width: 500px) {
  body { padding: 8px; }
  h1 { font-size: 1.2rem; }
  .mobile-hint { display: block; }
  button { padding: 8px 16px; font-size: 0.9rem; }
}
@media (hover: none) and (pointer: coarse) {
  .mobile-hint { display: block; }
}
</style>
</head>
<body>
<h1>Bug Hunt</h1>
<div class="controls">
  <button id="start" data-testid="start">Start</button>
  <div id="score-display" data-testid="score">Sparks: <span>0</span> / 5</div>
  <span class="best" id="best-display"></span>
</div>
<div id="stage" data-testid="stage">
  <div id="player" class="player"></div>
  <div id="enemy" class="enemy"></div>
  <button id="action" data-testid="primary-action" style="position:absolute;bottom:8px;right:8px;z-index:5;font-size:0.8rem;">MOVE</button>
</div>
<p id="result" data-testid="result"></p>
<p class="mobile-hint">Tap the stage to move the player toward that point.</p>

<script>
(function () {
  'use strict';

  /* ---- DOM references ---- */
  const stage     = document.getElementById('stage');
  const playerEl  = document.getElementById('player');
  const enemyEl   = document.getElementById('enemy');
  const startBtn  = document.getElementById('start');
  const actionBtn = document.getElementById('action');
  const resultEl  = document.getElementById('result');
  const scoreSpan = document.querySelector('#score-display span');
  const bestEl    = document.getElementById('best-display');

  /* ---- Constants ---- */
  const SPARK_COUNT  = 5;
  const PLAYER_SIZE  = 34;
  const ENEMY_SIZE   = 40;
  const SPARK_SIZE   = 18;
  const PLAYER_SPEED = 4;
  const ENEMY_SPEED  = 2.2;
  const LS_KEY        = 'bench.bug-hunt-best';

  /* ---- State ---- */
  let state = {
    phase: 'idle',       // idle | playing | won | lost
    score: 0,
    progress: 0,
    px: 0, py: 0,
    ex: 0, ey: 0,
    sparks: [],          // [{x, y, el}]
    keys: {},            // currently pressed keys
    targetX: null,       // pointer target x (px)
    targetY: null,       // pointer target y (px)
  };

  let rafId = null;
  let sparkEls = [];     // DOM spark elements

  /* ---- Helpers ---- */
  function getStageW() { return stage.clientWidth; }
  function getStageH() { return stage.clientHeight; }

  function rectsOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function randomPos(size) {
    const w = getStageW();
    const h = getStageH();
    return {
      x: Math.random() * (w - size),
      y: Math.random() * (h - size),
    };
  }

  function bestScore() {
    try { return parseInt(localStorage.getItem(LS_KEY), 10) || 0; } catch (e) { return 0; }
  }
  function saveBest(s) {
    try { localStorage.setItem(LS_KEY, String(s)); } catch (e) { /* quota */ }
  }

  /* ---- Spark management ---- */
  function createSparkElements() {
    removeSparkElements();
    for (let i = 0; i < SPARK_COUNT; i++) {
      const el = document.createElement('div');
      el.className = 'spark';
      stage.appendChild(el);
      sparkEls.push(el);
    }
  }

  function removeSparkElements() {
    sparkEls.forEach(function (el) { el.remove(); });
    sparkEls = [];
  }

  function respawnSparks() {
    const w = getStageW();
    const h = getStageH();
    state.sparks = [];
    for (let i = 0; i < SPARK_COUNT; i++) {
      const pos = randomPos(SPARK_SIZE);
      state.sparks.push({ x: pos.x, y: pos.y, collected: false, el: sparkEls[i] });
    }
    renderSparks();
  }

  function renderSparks() {
    state.sparks.forEach(function (s) {
      if (s.collected) {
        s.el.style.display = 'none';
      } else {
        s.el.style.display = '';
        s.el.style.left  = s.x + 'px';
        s.el.style.top   = s.y + 'px';
      }
    });
  }

  /* ---- Render ---- */
  function renderPlayer() {
    playerEl.style.left = state.px + 'px';
    playerEl.style.top  = state.py + 'px';
  }
  function renderEnemy() {
    enemyEl.style.left = state.ex + 'px';
    enemyEl.style.top  = state.ey + 'px';
  }

  /* ---- UI ---- */
  function updateUI() {
    scoreSpan.textContent = state.score;
    const pct = Math.round((state.score / SPARK_COUNT) * 100);
    state.progress = pct;
    scoreSpan.parentElement.setAttribute('data-testid', 'score');
  }

  function updateBestDisplay() {
    const b = bestScore();
    if (b > 0) bestEl.textContent = 'Best: ' + b + ' sparks';
    else bestEl.textContent = '';
  }

  function showResult(msg, cls) {
    resultEl.textContent = msg;
    resultEl.className = cls;
  }

  function clearResult() {
    resultEl.textContent = '';
    resultEl.className = '';
  }

  /* ---- Enemy AI ---- */
  function moveEnemy() {
    const dx = state.px - state.ex;
    const dy = state.py - state.ey;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 1) return;
    const stepX = (dx / dist) * ENEMY_SPEED;
    const stepY = (dy / dist) * ENEMY_SPEED;
    state.ex = clamp(state.ex + stepX, 0, getStageW() - ENEMY_SIZE);
    state.ey = clamp(state.ey + stepY, 0, getStageH() - ENEMY_SIZE);
  }

  /* ---- Player movement from keyboard ---- */
  function movePlayer() {
    const w = getStageW();
    const h = getStageH();
    // If pointer target is active, move toward it
    if (state.targetX !== null && state.targetY !== null) {
      const dx = state.targetX - state.px;
      const dy = state.targetY - state.py;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 3) {
        state.targetX = null;
        state.targetY = null;
      } else {
        state.px = clamp(state.px + (dx / dist) * PLAYER_SPEED, 0, w - PLAYER_SIZE);
        state.py = clamp(state.py + (dy / dist) * PLAYER_SPEED, 0, h - PLAYER_SIZE);
      }
    }
    // Keyboard overrides / supplements
    const k = state.keys;
    let kdx = 0, kdy = 0;
    if (k.ArrowRight || k.KeyD) kdx += 1;
    if (k.ArrowLeft  || k.KeyA) kdx -= 1;
    if (k.ArrowDown  || k.KeyS) kdy += 1;
    if (k.ArrowUp    || k.KeyW) kdy -= 1;
    if (kdx !== 0 || kdy !== 0) {
      // Cancel pointer target when keyboard used
      state.targetX = null;
      state.targetY = null;
      const mag = Math.sqrt(kdx * kdx + kdy * kdy);
      state.px = clamp(state.px + (kdx / mag) * PLAYER_SPEED, 0, w - PLAYER_SIZE);
      state.py = clamp(state.py + (kdy / mag) * PLAYER_SPEED, 0, h - PLAYER_SIZE);
    }
  }

  /* ---- Collision checks ---- */
  function checkSparkCollection() {
    let collected = false;
    state.sparks.forEach(function (s) {
      if (s.collected) return;
      if (rectsOverlap(state.px, state.py, PLAYER_SIZE, PLAYER_SIZE,
                       s.x, s.y, SPARK_SIZE, SPARK_SIZE)) {
        s.collected = true;
        collected = true;
      }
    });
    if (collected) {
      state.score = state.sparks.filter(function (s) { return s.collected; }).length;
      updateUI();
      renderSparks();
    }
  }

  function checkEnemyCollision() {
    return rectsOverlap(state.px, state.py, PLAYER_SIZE, PLAYER_SIZE,
                        state.ex, state.ey, ENEMY_SIZE, ENEMY_SIZE);
  }

  /* ---- Win / Lose ---- */
  function win() {
    state.phase = 'won';
    state.progress = 100;
    const b = bestScore();
    if (state.score > b) saveBest(state.score);
    updateBestDisplay();
    playerEl.classList.remove('hit');
    showResult('You collected all sparks! You win!', 'win');
    stopLoop();
  }

  function lose() {
    state.phase = 'lost';
    const b = bestScore();
    if (state.score > b) saveBest(state.score);
    updateBestDisplay();
    playerEl.classList.add('hit');
    showResult('The enemy caught you! You lose.', 'lose');
    stopLoop();
  }

  /* ---- Game loop ---- */
  function gameLoop() {
    if (state.phase !== 'playing') return;
    movePlayer();
    moveEnemy();
    checkSparkCollection();
    renderPlayer();
    renderEnemy();

    if (checkEnemyCollision()) {
      lose();
      return;
    }
    if (state.score >= SPARK_COUNT) {
      win();
      return;
    }
    rafId = requestAnimationFrame(gameLoop);
  }

  function stopLoop() {
    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }
  }

  /* ---- Full reset (back to idle, no leftovers) ---- */
  function fullReset() {
    stopLoop();
    state.keys = {};
    state.targetX = null;
    state.targetY = null;
    playerEl.classList.remove('hit');
    state.phase  = 'idle';
    state.score  = 0;
    state.progress = 0;
    removeSparkElements();
    state.sparks = [];
    updateUI();
    clearResult();
    // Reset positions
    state.px = 10;
    state.py = 10;
    state.ex = 680;
    state.ey = 360;
    renderPlayer();
    renderEnemy();
  }

  /* ---- Start ---- */
  function startGame() {
    stopLoop();
    // Reset from any previous state
    state.keys = {};
    state.targetX = null;
    state.targetY = null;
    playerEl.classList.remove('hit');
    state.phase  = 'playing';
    state.score  = 0;
    state.progress = 0;

    // Position player
    state.px = 40;
    state.py = 40;

    // Position enemy away from player
    state.ex = clamp(getStageW() - ENEMY_SIZE - 20, 0, getStageW() - ENEMY_SIZE);
    state.ey = clamp(getStageH() - ENEMY_SIZE - 20, 0, getStageH() - ENEMY_SIZE);

    // Create sparks and respawn
    createSparkElements();
    respawnSparks();

    updateUI();
    clearResult();
    renderPlayer();
    renderEnemy();

    rafId = requestAnimationFrame(gameLoop);
  }

  /* ---- Event handlers ---- */
  startBtn.addEventListener('click', function () {
    if (state.phase === 'playing') {
      // Restart
      fullReset();
      startGame();
    } else {
      startGame();
    }
  });

  // Keyboard
  window.addEventListener('keydown', function (e) {
    if (state.phase !== 'playing') return;
    state.keys[e.code] = true;
    e.preventDefault();
  });
  window.addEventListener('keyup', function (e) {
    state.keys[e.code] = false;
  });

  // Blur clears keys to avoid sticky keys
  window.addEventListener('blur', function () {
    state.keys = {};
  });

  // Pointer / touch on stage to move player
  stage.addEventListener('pointerdown', function (e) {
    if (state.phase !== 'playing') return;
    e.preventDefault();
    const rect = stage.getBoundingClientRect();
    state.targetX = e.clientX - rect.left - PLAYER_SIZE / 2;
    state.targetY = e.clientY - rect.top - PLAYER_SIZE / 2;
    state.targetX = clamp(state.targetX, 0, getStageW() - PLAYER_SIZE);
    state.targetY = clamp(state.targetY, 0, getStageH() - PLAYER_SIZE);
  });
  stage.addEventListener('pointermove', function (e) {
    if (state.phase !== 'playing') return;
    if (e.buttons > 0) {
      e.preventDefault();
      const rect = stage.getBoundingClientRect();
      state.targetX = e.clientX - rect.left - PLAYER_SIZE / 2;
      state.targetY = e.clientY - rect.top - PLAYER_SIZE / 2;
      state.targetX = clamp(state.targetX, 0, getStageW() - PLAYER_SIZE);
      state.targetY = clamp(state.targetY, 0, getStageH() - PLAYER_SIZE);
    }
  });

  // MOVE button: move player down a bit (legacy control)
  actionBtn.addEventListener('click', function () {
    if (state.phase !== 'playing') return;
    state.targetX = null;
    state.targetY = null;
    state.py = clamp(state.py + 50, 0, getStageH() - PLAYER_SIZE);
  });

  /* ---- __benchmark adapter ---- */
  window.__benchmark = {
    start: function () {
      fullReset();
      startGame();
    },
    act: function () {
      // Move player right; produces observable state change
      if (state.phase === 'playing') {
        state.px = clamp(state.px + 40, 0, getStageW() - PLAYER_SIZE);
        renderPlayer();
      }
    },
    complete: function () {
      if (state.phase !== 'playing') return;
      // Force-collect all sparks and trigger win
      state.sparks.forEach(function (s) { s.collected = true; });
      state.score = SPARK_COUNT;
      updateUI();
      renderSparks();
      win();
    },
    reset: function () {
      fullReset();
    },
    getState: function () {
      return {
        phase: state.phase,
        score: state.score,
        progress: state.progress,
        px: state.px,
        py: state.py,
      };
    },
  };

  /* ---- Initial render ---- */
  (function init() {
    fullReset();
    updateBestDisplay();
  })();
})();
</script>
</body>
</html>
