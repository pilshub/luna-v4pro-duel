<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circuit Mosaic</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --text-dim: #8b949e;
  --pcb-bg: #1a2b1a;
  --pcb-border: #2a3f2a;
  --trace: #c9a96e;
  --trace-glow: #4ade80;
  --pad: #8b7355;
  --source-led: #22c55e;
  --dest-led: #f59e0b;
  --btn-bg: #238636;
  --btn-hover: #2ea043;
  --btn-text: #fff;
  --danger-bg: #da3633;
  --danger-hover: #f85149;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  user-select: none;
}

.game-container {
  width: 100%;
  max-width: 500px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

h1 {
  font-size: clamp(1.4rem, 4vw, 1.8rem);
  font-weight: 700;
  letter-spacing: 0.04em;
  text-align: center;
  color: var(--trace);
  text-shadow: 0 0 20px rgba(201,169,110,0.3);
}

.stats-bar {
  display: flex;
  gap: 24px;
  font-size: 1rem;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

.stats-bar span {
  display: flex;
  align-items: center;
  gap: 6px;
}

.stats-bar .label { color: var(--text-dim); }
.stats-bar .value { color: var(--text); font-weight: 600; min-width: 2.5em; text-align: center; }

.board-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  width: 100%;
  max-width: 420px;
  aspect-ratio: 1.15;
}

.source-led, .dest-led {
  position: absolute;
  width: clamp(12px, 3.5vw, 18px);
  height: clamp(12px, 3.5vw, 18px);
  border-radius: 50%;
  top: 50%;
  transform: translateY(-50%);
  box-shadow: 0 0 12px currentColor;
  z-index: 2;
}

.source-led {
  left: clamp(2px, 0.5vw, 6px);
  background: var(--source-led);
  color: var(--source-led);
  box-shadow: 0 0 14px var(--source-led);
}

.dest-led {
  right: clamp(2px, 0.5vw, 6px);
  background: var(--dest-led);
  color: var(--dest-led);
  box-shadow: 0 0 14px var(--dest-led);
}

.board-led-line {
  position: absolute;
  top: 50%;
  height: 2px;
  background: var(--trace);
  opacity: 0.5;
  transform: translateY(-50%);
}

.board-led-line.left {
  left: clamp(16px, 4vw, 28px);
  right: calc(100% - clamp(30px, 7vw, 48px));
}

.board-led-line.right {
  right: clamp(16px, 4vw, 28px);
  left: calc(100% - clamp(30px, 7vw, 48px));
}

.board-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: clamp(3px, 0.8vw, 6px);
  width: 100%;
  padding: clamp(4px, 1vw, 10px);
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 12px;
  margin: 0 clamp(20px, 5vw, 40px);
  aspect-ratio: 1;
}

.tile {
  position: relative;
  aspect-ratio: 1;
  cursor: pointer;
  border-radius: clamp(4px, 1vw, 8px);
  background: var(--pcb-bg);
  border: 1.5px solid var(--pcb-border);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  overflow: hidden;
}

.tile:hover {
  border-color: var(--trace);
  box-shadow: 0 0 8px rgba(201,169,110,0.25);
}

.tile:focus-visible {
  outline: 3px solid var(--trace);
  outline-offset: 2px;
  border-color: var(--trace);
  box-shadow: 0 0 12px rgba(201,169,110,0.4);
}

.tile:active { transform: scale(0.95); }

.tile.connected .tile-svg { filter: brightness(1.3) saturate(1.2); }
.tile.connected { border-color: var(--trace-glow); box-shadow: 0 0 14px rgba(74,222,128,0.35); }

.tile.connected .trace-line { stroke: var(--trace-glow); }
.tile.connected .trace-pad { fill: #3fb568; stroke: var(--trace-glow); }
.tile.connected .trace-center { fill: #3fb568; stroke: var(--trace-glow); stroke-width: 3; }

.tile-svg {
  width: 100%;
  height: 100%;
  display: block;
  transition: transform 0.18s ease;
}

.trace-line { stroke: var(--trace); stroke-linecap: round; }
.trace-pad { fill: var(--pad); stroke: var(--trace); stroke-width: 2; }
.trace-center { fill: var(--pad); stroke: var(--trace); stroke-width: 2.5; }

.result-area {
  min-height: 2em;
  font-size: clamp(1rem, 3vw, 1.3rem);
  font-weight: 700;
  text-align: center;
  color: var(--trace-glow);
  text-shadow: 0 0 12px rgba(74,222,128,0.5);
  transition: opacity 0.3s ease;
}

.result-area:empty { opacity: 0; }

.best-display {
  font-size: 0.9rem;
  color: var(--text-dim);
}

.button-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
}

.btn:focus-visible {
  outline: 3px solid var(--text);
  outline-offset: 2px;
}

.btn:active { transform: scale(0.96); }

.btn-start {
  background: var(--btn-bg);
  color: var(--btn-text);
}

.btn-start:hover { background: var(--btn-hover); }

.btn-reset {
  background: var(--surface);
  color: var(--text);
  border: 1.5px solid var(--border);
}

.btn-reset:hover { background: var(--border); }

.score-display {
  font-size: 0.95rem;
  color: var(--text-dim);
}

@media (max-width: 420px) {
  body { padding: 10px; }
  .game-container { gap: 10px; }
  .board-wrapper { max-width: 100%; }
  .btn { padding: 8px 18px; font-size: 0.9rem; }
}
</style>
</head>
<body>
<div class="game-container">
  <h1>Circuit Mosaic</h1>

  <div class="stats-bar">
    <span><span class="label">Time</span> <span class="value" id="timer">00:00</span></span>
    <span><span class="label">Moves</span> <span class="value" data-testid="score" id="moveCount">0</span></span>
  </div>

  <div class="board-wrapper">
    <div class="source-led" aria-label="Source"></div>
    <div class="board-led-line left"></div>
    <div class="board-grid" data-testid="stage" id="boardGrid" role="grid" aria-label="Circuit board grid"></div>
    <div class="board-led-line right"></div>
    <div class="dest-led" aria-label="Destination"></div>
  </div>

  <div class="result-area" data-testid="result" id="resultMsg"></div>

  <div class="best-display" id="bestDisplay"></div>

  <div class="button-row">
    <button class="btn btn-start" data-testid="start" id="startBtn">Start Game</button>
    <button class="btn btn-reset" id="resetBtn">Reset</button>
  </div>

  <div class="score-display" id="scoreDetail"></div>
</div>

<script>
(function() {
  'use strict';

  // ── Tile Definitions ──────────────────────────────────────────────
  const DIRS = ['N','E','S','W'];
  const TILE_DEFS = {
    straight: { connections: ['W','E'] },
    corner:   { connections: ['W','N'] },
    blank:    { connections: [] }
  };

  function rotateDir(dir, steps) {
    return DIRS[(DIRS.indexOf(dir) + (steps % 4) + 4) % 4];
  }

  function getConnections(type, rotation) {
    return TILE_DEFS[type].connections.map(d => rotateDir(d, rotation));
  }

  function tileConnects(tile, dir) {
    return getConnections(tile.type, tile.rotation).includes(dir);
  }

  // ── SVG Generation ────────────────────────────────────────────────
  function tileSVG(type, rotation) {
    const conns = getConnections(type, rotation);
    let svg = '<svg viewBox="0 0 100 100" class="tile-svg" xmlns="http://www.w3.org/2000/svg">';
    svg += '<rect x="3" y="3" width="94" height="94" rx="8" fill="none" stroke="none"/>';

    // Draw traces
    if (conns.includes('N')) {
      svg += '<line class="trace-line" x1="50" y1="50" x2="50" y2="4" stroke-width="15"/>';
      svg += '<circle class="trace-pad" cx="50" cy="7" r="5.5"/>';
    }
    if (conns.includes('E')) {
      svg += '<line class="trace-line" x1="50" y1="50" x2="96" y2="50" stroke-width="15"/>';
      svg += '<circle class="trace-pad" cx="93" cy="50" r="5.5"/>';
    }
    if (conns.includes('S')) {
      svg += '<line class="trace-line" x1="50" y1="50" x2="50" y2="96" stroke-width="15"/>';
      svg += '<circle class="trace-pad" cx="50" cy="93" r="5.5"/>';
    }
    if (conns.includes('W')) {
      svg += '<line class="trace-line" x1="50" y1="50" x2="4" y2="50" stroke-width="15"/>';
      svg += '<circle class="trace-pad" cx="7" cy="50" r="5.5"/>';
    }

    // Center junction
    if (conns.length > 0) {
      svg += '<circle class="trace-center" cx="50" cy="50" r="9"/>';
    } else {
      svg += '<circle cx="50" cy="50" r="4" fill="var(--pad)" opacity="0.4"/>';
    }

    svg += '</svg>';
    return svg;
  }

  // ── Game State ────────────────────────────────────────────────────
  const SIZE = 4;
  let board = [];          // board[r][c] = { type, rotation, solutionRotation }
  let pathCoords = [];     // solution path coordinates [[r,c],...]
  let pathSet = null;      // Set("r,c") for quick lookup
  let phase = 'idle';      // 'idle' | 'playing' | 'won'
  let moveCount = 0;
  let timerSeconds = 0;
  let timerInterval = null;
  let bestScore = null;    // { moves, time } or null

  // ── Board Generation ──────────────────────────────────────────────
  function generatePath() {
    const startRow = Math.floor(Math.random() * SIZE);
    const path = [[startRow, 0]];
    const visited = new Set([`${startRow},0`]);
    let r = startRow, c = 0;

    while (c < SIZE - 1) {
      const options = [];
      // Right
      if (!visited.has(`${r},${c+1}`)) options.push([r, c+1]);
      // Up
      if (r > 0 && !visited.has(`${r-1},${c}`)) options.push([r-1, c]);
      // Down
      if (r < SIZE-1 && !visited.has(`${r+1},${c}`)) options.push([r+1, c]);

      if (options.length === 0) {
        // Force right if stuck (should be rare)
        c += 1;
      } else {
        const choice = options[Math.floor(Math.random() * options.length)];
        r = choice[0];
        c = choice[1];
      }

      path.push([r, c]);
      visited.add(`${r},${c}`);

      if (path.length > SIZE * SIZE) break; // safety
    }

    // Ensure last tile is in column SIZE-1
    while (path[path.length - 1][1] < SIZE - 1) {
      const [lr, lc] = path[path.length - 1];
      path.push([lr, lc + 1]);
    }

    return path;
  }

  function getPathTileConnections(path, idx) {
    const [r, c] = path[idx];
    const conns = new Set();

    // Source edge for first path tile in column 0
    if (c === 0 && idx === 0) conns.add('W');

    // Destination edge for last path tile in column SIZE-1
    if (c === SIZE - 1 && idx === path.length - 1) conns.add('E');

    // Entry from previous tile
    if (idx > 0) {
      const [pr, pc] = path[idx - 1];
      if (pc < c) conns.add('W');
      else if (pc > c) conns.add('E');
      else if (pr < r) conns.add('N');
      else conns.add('S');
    }

    // Exit to next tile
    if (idx < path.length - 1) {
      const [nr, nc] = path[idx + 1];
      if (nc > c) conns.add('E');
      else if (nc < c) conns.add('W');
      else if (nr > r) conns.add('S');
      else conns.add('N');
    }

    return [...conns];
  }

  function connsToTile(conns) {
    const s = [...new Set(conns)].sort().join('');
    const map = {
      'EW':  { type: 'straight', rot: 0 },
      'NS':  { type: 'straight', rot: 1 },
      'NW':  { type: 'corner',   rot: 0 },
      'EN':  { type: 'corner',   rot: 1 },
      'ES':  { type: 'corner',   rot: 2 },
      'SW':  { type: 'corner',   rot: 3 },
    };
    if (map[s]) return map[s];

    // Fallback: find matching corner rotation
    const set = new Set(conns);
    if (set.size === 2) {
      const arr = [...set];
      // Try all corner rotations
      for (let r = 0; r < 4; r++) {
        const c0 = rotateDir('W', r);
        const c1 = rotateDir('N', r);
        if ((c0 === arr[0] && c1 === arr[1]) || (c0 === arr[1] && c1 === arr[0])) {
          return { type: 'corner', rot: r };
        }
      }
    }
    return { type: 'straight', rot: 0 };
  }

  function generateBoard() {
    const path = generatePath();
    pathCoords = path;
    pathSet = new Set(path.map(([r, c]) => `${r},${c}`));

    // Initialize board with random fillers
    board = [];
    for (let r = 0; r < SIZE; r++) {
      board[r] = [];
      for (let c = 0; c < SIZE; c++) {
        const fillerTypes = ['blank', 'blank', 'straight', 'corner'];
        const ft = fillerTypes[Math.floor(Math.random() * fillerTypes.length)];
        board[r][c] = {
          type: ft,
          rotation: Math.floor(Math.random() * 4),
          solutionRotation: 0 // placeholder
        };
      }
    }

    // Place path tiles
    for (let i = 0; i < path.length; i++) {
      const [r, c] = path[i];
      const conns = getPathTileConnections(path, i);
      const tileDef = connsToTile(conns);
      board[r][c] = {
        type: tileDef.type,
        rotation: Math.floor(Math.random() * 4), // scrambled rotation
        solutionRotation: tileDef.rot
      };
    }
  }

  // ── Connectivity Check (BFS) ─────────────────────────────────────
  function findConnectedPath() {
    const queue = [];
    const parent = {};
    let startKey = null;

    // Find source tiles (col 0, connects West)
    for (let r = 0; r < SIZE; r++) {
      if (tileConnects(board[r][0], 'W')) {
        const key = `${r},0`;
        queue.push([r, 0]);
        parent[key] = null;
        startKey = key;
      }
    }

    if (queue.length === 0) return null;

    const visited = new Set(queue.map(([r, c]) => `${r},${c}`));
    let qi = 0;

    while (qi < queue.length) {
      const [r, c] = queue[qi++];
      const tile = board[r][c];

      // Check if reached destination
      if (c === SIZE - 1 && tileConnects(tile, 'E')) {
        // Reconstruct path
        const result = [];
        let key = `${r},${c}`;
        while (key !== null) {
          const [rr, cc] = key.split(',').map(Number);
          result.unshift([rr, cc]);
          key = parent[key];
        }
        return result;
      }

      const neighbors = [
        [r, c-1, 'W', 'E'],
        [r, c+1, 'E', 'W'],
        [r-1, c, 'N', 'S'],
        [r+1, c, 'S', 'N']
      ];

      for (const [nr, nc, myDir, theirDir] of neighbors) {
        if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) continue;
        const nkey = `${nr},${nc}`;
        if (visited.has(nkey)) continue;
        if (!tileConnects(tile, myDir)) continue;
        if (!tileConnects(board[nr][nc], theirDir)) continue;

        visited.add(nkey);
        parent[nkey] = `${r},${c}`;
        queue.push([nr, nc]);
      }
    }

    return null;
  }

  function checkWin() {
    return findConnectedPath() !== null;
  }

  // ── Scoring ───────────────────────────────────────────────────────
  const STORAGE_KEY = 'bench.circuitMosaic.best';

  function loadBest() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        bestScore = JSON.parse(raw);
      }
    } catch (e) {
      bestScore = null;
    }
  }

  function saveBest(moves, time) {
    bestScore = { moves, time };
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(bestScore));
    } catch (e) { /* storage unavailable */ }
  }

  function updateBestDisplay() {
    const el = document.getElementById('bestDisplay');
    if (bestScore) {
      const ts = formatTime(bestScore.time);
      el.textContent = `Best: ${bestScore.moves} moves in ${ts}`;
    } else {
      el.textContent = 'Best: —';
    }
  }

  // ── Timer ─────────────────────────────────────────────────────────
  function formatTime(secs) {
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function startTimer() {
    stopTimer();
    timerSeconds = 0;
    document.getElementById('timer').textContent = '00:00';
    timerInterval = setInterval(() => {
      timerSeconds++;
      document.getElementById('timer').textContent = formatTime(timerSeconds);
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  // ── Rendering ─────────────────────────────────────────────────────
  function renderBoard() {
    const grid = document.getElementById('boardGrid');
    grid.innerHTML = '';

    // Find winning path for highlighting
    let winPath = null;
    if (phase === 'won') {
      winPath = findConnectedPath();
    }

    const winSet = winPath ? new Set(winPath.map(([r, c]) => `${r},${c}`)) : null;

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const tile = board[r][c];
        const tileEl = document.createElement('div');
        tileEl.className = 'tile';
        tileEl.setAttribute('role', 'gridcell');
        tileEl.setAttribute('tabindex', '0');
        tileEl.setAttribute('aria-label', `Tile row ${r+1} column ${c+1}, ${tile.type}, rotation ${tile.rotation}`);
        tileEl.dataset.row = r;
        tileEl.dataset.col = c;

        // Set primary-action on the first path tile
        const firstPath = pathCoords[0];
        if (firstPath && r === firstPath[0] && c === firstPath[1]) {
          tileEl.setAttribute('data-testid', 'primary-action');
        }

        // Highlight if on winning path
        if (winSet && winSet.has(`${r},${c}`)) {
          tileEl.classList.add('connected');
        }

        tileEl.addEventListener('click', () => rotateTile(r, c));
        tileEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            rotateTile(r, c);
          }
        });

        // Apply CSS rotation transform
        const rotDeg = tile.rotation * 90;
        const svgStr = tileSVG(tile.type, 0); // SVG at rotation 0, CSS handles visual rotation

        tileEl.innerHTML = svgStr;
        const svgEl = tileEl.querySelector('.tile-svg');
        if (svgEl) {
          svgEl.style.transform = `rotate(${rotDeg}deg)`;
        }

        grid.appendChild(tileEl);
      }
    }
  }

  function renderAll() {
    renderBoard();
    document.getElementById('moveCount').textContent = moveCount;
    updateBestDisplay();
  }

  // ── Game Actions ──────────────────────────────────────────────────
  function rotateTile(r, c) {
    if (phase !== 'playing') return;
    board[r][c].rotation = (board[r][c].rotation + 1) % 4;
    moveCount++;
    document.getElementById('moveCount').textContent = moveCount;

    // Re-render just this tile
    const tileEl = document.querySelector(`.tile[data-row="${r}"][data-col="${c}"]`);
    if (tileEl) {
      const tile = board[r][c];
      const svgEl = tileEl.querySelector('.tile-svg');
      if (svgEl) {
        svgEl.style.transform = `rotate(${tile.rotation * 90}deg)`;
      }
      tileEl.setAttribute('aria-label', `Tile row ${r+1} column ${c+1}, ${tile.type}, rotation ${tile.rotation}`);

      // Quick visual feedback
      tileEl.style.transform = 'scale(0.92)';
      setTimeout(() => { tileEl.style.transform = ''; }, 100);
    }

    // Check win after rotation
    if (checkWin()) {
      handleWin();
    }
  }

  function handleWin() {
    phase = 'won';
    stopTimer();
    renderBoard(); // Re-render with highlights

    const resultEl = document.getElementById('resultMsg');
    resultEl.textContent = 'Circuit Complete!';

    // Update best score
    const isNewBest = !bestScore || moveCount < bestScore.moves ||
      (moveCount === bestScore.moves && timerSeconds < bestScore.time);

    if (isNewBest) {
      saveBest(moveCount, timerSeconds);
    }

    updateBestDisplay();
    document.getElementById('scoreDetail').textContent =
      `Solved in ${moveCount} moves / ${formatTime(timerSeconds)}` +
      (isNewBest ? ' (New best!)' : '');
  }

  function startGame() {
    generateBoard();
    phase = 'playing';
    moveCount = 0;
    document.getElementById('moveCount').textContent = '0';
    document.getElementById('resultMsg').textContent = '';
    document.getElementById('scoreDetail').textContent = '';
    renderBoard();
    startTimer();
    updateBestDisplay();

    // Focus first tile
    const firstTile = document.querySelector('.tile[data-row="0"][data-col="0"]');
    if (firstTile) firstTile.focus();
  }

  function resetGame() {
    stopTimer();
    phase = 'idle';
    moveCount = 0;
    timerSeconds = 0;
    document.getElementById('timer').textContent = '00:00';
    document.getElementById('moveCount').textContent = '0';
    document.getElementById('resultMsg').textContent = '';
    document.getElementById('scoreDetail').textContent = '';
    generateBoard();
    renderBoard();
    updateBestDisplay();
    document.getElementById('startBtn').focus();
  }

  // ── Event Listeners ───────────────────────────────────────────────
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('resetBtn').addEventListener('click', resetGame);

  // Keyboard: arrow keys to navigate tiles
  document.addEventListener('keydown', (e) => {
    if (phase !== 'playing') return;
    const active = document.activeElement;
    if (!active || !active.classList.contains('tile')) return;

    const r = parseInt(active.dataset.row);
    const c = parseInt(active.dataset.col);
    let nr = r, nc = c;

    switch (e.key) {
      case 'ArrowUp':    nr = Math.max(0, r - 1); break;
      case 'ArrowDown':  nr = Math.min(SIZE - 1, r + 1); break;
      case 'ArrowLeft':  nc = Math.max(0, c - 1); break;
      case 'ArrowRight': nc = Math.min(SIZE - 1, c + 1); break;
      default: return;
    }

    e.preventDefault();
    const nextTile = document.querySelector(`.tile[data-row="${nr}"][data-col="${nc}"]`);
    if (nextTile) nextTile.focus();
  });

  // ── Benchmark Adapter ─────────────────────────────────────────────
  window.__benchmark = {
    start() {
      stopTimer();
      generateBoard();
      phase = 'playing';
      moveCount = 0;
      timerSeconds = 0;
      document.getElementById('moveCount').textContent = '0';
      document.getElementById('timer').textContent = '00:00';
      document.getElementById('resultMsg').textContent = '';
      document.getElementById('scoreDetail').textContent = '';
      renderBoard();
      startTimer();
    },

    act() {
      if (phase !== 'playing' || pathCoords.length === 0) return;
      const [r, c] = pathCoords[0];
      rotateTile(r, c);
    },

    complete() {
      if (phase !== 'playing') return;

      // Set all tiles to their solution rotations
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          board[r][c].rotation = board[r][c].solutionRotation;
        }
      }
      renderBoard();

      if (checkWin()) {
        handleWin();
      }
    },

    reset() {
      stopTimer();
      phase = 'idle';
      moveCount = 0;
      timerSeconds = 0;
      document.getElementById('timer').textContent = '00:00';
      document.getElementById('moveCount').textContent = '0';
      document.getElementById('resultMsg').textContent = '';
      document.getElementById('scoreDetail').textContent = '';
      generateBoard();
      renderBoard();
    },

    getState() {
      let progress = 0;
      if (pathCoords.length > 0) {
        let correct = 0;
        for (const [r, c] of pathCoords) {
          if (board[r] && board[r][c] && board[r][c].rotation === board[r][c].solutionRotation) {
            correct++;
          }
        }
        progress = correct / pathCoords.length;
      }

      return {
        phase: phase === 'playing' ? 'playing' : phase === 'won' ? 'won' : 'idle',
        score: moveCount,
        progress: Math.round(progress * 100) / 100
      };
    }
  };

  // ── Initialization ────────────────────────────────────────────────
  loadBest();
  generateBoard();
  renderBoard();
  updateBestDisplay();
})();
</script>
