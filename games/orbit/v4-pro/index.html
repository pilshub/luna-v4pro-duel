<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Orbit Courier</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0a14;
  color: #e0e0f0;
  font-family: 'Courier New', monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.game-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: 800px;
  padding: 8px;
}

.title {
  font-size: clamp(18px, 4vw, 28px);
  font-weight: bold;
  color: #7ec8f8;
  text-transform: uppercase;
  letter-spacing: 3px;
  text-shadow: 0 0 20px rgba(126, 200, 248, 0.5);
}

.stage-container {
  width: 100%;
  max-width: 800px;
  position: relative;
  border: 2px solid rgba(126, 200, 248, 0.3);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(126, 200, 248, 0.1), inset 0 0 40px rgba(0, 0, 0, 0.3);
}

.stage-container::after {
  content: '';
  display: block;
  padding-bottom: 75%; /* 600/800 */
}

canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: crosshair;
  touch-action: none;
}

.hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 800px;
  gap: 16px;
}

.hud-item {
  font-size: clamp(12px, 2.5vw, 16px);
  color: #a0a0c0;
  background: rgba(20, 20, 40, 0.8);
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid rgba(126, 200, 248, 0.2);
  white-space: nowrap;
}

.hud-item span {
  color: #7ec8f8;
  font-weight: bold;
}

.result-area {
  min-height: 28px;
  font-size: clamp(14px, 3vw, 20px);
  font-weight: bold;
  text-align: center;
  letter-spacing: 1px;
  transition: color 0.3s;
}

.result-area.win { color: #4fda6e; text-shadow: 0 0 16px rgba(79, 218, 110, 0.6); }
.result-area.lose { color: #f85c5c; text-shadow: 0 0 16px rgba(248, 92, 92, 0.6); }

.btn {
  font-family: 'Courier New', monospace;
  font-size: clamp(14px, 3vw, 18px);
  font-weight: bold;
  padding: 10px 32px;
  border: 2px solid #7ec8f8;
  border-radius: 8px;
  background: rgba(20, 40, 80, 0.9);
  color: #7ec8f8;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 2px;
  transition: all 0.2s;
  touch-action: manipulation;
}

.btn:hover {
  background: rgba(40, 80, 140, 0.9);
  box-shadow: 0 0 20px rgba(126, 200, 248, 0.4);
}

.btn:focus-visible {
  outline: 3px solid #7ec8f8;
  outline-offset: 3px;
}

.btn:active {
  transform: scale(0.96);
}

.best-time {
  font-size: clamp(11px, 2vw, 14px);
  color: #706890;
}
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="title">Orbit Courier</div>

  <div class="stage-container" data-testid="stage">
    <canvas id="gameCanvas" data-testid="primary-action" width="800" height="600"></canvas>
  </div>

  <div class="hud">
    <div class="hud-item" data-testid="score">Cells: <span>0</span> / 3</div>
    <div class="hud-item" id="timerDisplay">Time: <span>0.0</span>s</div>
    <div class="hud-item best-time" id="bestDisplay">Best: <span>--</span>s</div>
  </div>

  <div class="result-area" data-testid="result"></div>

  <button class="btn" data-testid="start" id="startBtn">Start</button>
</div>

<script>
(function() {
  /* ── Constants ────────────────────────────── */
  const WORLD_W = 800;
  const WORLD_H = 600;
  const CELLS_TOTAL = 3;
  const PLAYER_RADIUS = 13;
  const PLAYER_SPEED = 220;
  const CELL_RADIUS = 15;
  const HAZARD_RADIUS = 17;
  const HAZARD_BASE_SPEED = 90;
  const MARGIN = 40;
  const STORAGE_KEY = 'bench.orbit-courier-best';

  /* ── DOM refs ─────────────────────────────── */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('startBtn');
  const resultEl = document.querySelector('[data-testid="result"]');
  const scoreEl = document.querySelector('[data-testid="score"] span');
  const timerSpan = document.getElementById('timerDisplay').querySelector('span');
  const bestSpan = document.getElementById('bestDisplay').querySelector('span');

  /* ── State ────────────────────────────────── */
  let phase = 'idle';          // idle | playing | won | lost
  let collected = 0;
  let elapsed = 0;
  let player = { x: WORLD_W / 2, y: WORLD_H / 2 };
  let cells = [];
  let hazards = [];
  let particles = [];
  let stars = [];
  let keys = {};
  let pointerActive = false;
  let pointerWorldX = 0;
  let pointerWorldY = 0;
  let animationId = null;
  let lastTime = 0;
  let difficulty = 0;
  let bestTime = null;

  /* ── Load best ────────────────────────────── */
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored !== null) {
      const val = parseFloat(stored);
      if (!isNaN(val) && val > 0) bestTime = val;
    }
  } catch (_) { /* ignore */ }
  updateBestDisplay();

  /* ── Helpers ──────────────────────────────── */
  function rand(min, max) { return Math.random() * (max - min) + min; }
  function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function normalize(dx, dy) {
    const len = Math.hypot(dx, dy);
    return len < 0.001 ? { x: 0, y: 0 } : { x: dx / len, y: dy / len };
  }

  function randomArenaPos(margin) {
    return {
      x: rand(margin, WORLD_W - margin),
      y: rand(margin, WORLD_H - margin)
    };
  }

  /* ── Stars ────────────────────────────────── */
  function generateStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: rand(0, WORLD_W),
        y: rand(0, WORLD_H),
        r: rand(0.5, 2),
        brightness: rand(0.3, 1),
        twinkle: rand(0, Math.PI * 2)
      });
    }
  }
  generateStars();

  /* ── Spawn entities ────────────────────────── */
  function spawnCells() {
    cells = [];
    const positions = [];
    for (let i = 0; i < CELLS_TOTAL; i++) {
      let pos;
      let attempts = 0;
      do {
        pos = randomArenaPos(MARGIN + 30);
        attempts++;
      } while (attempts < 50 && positions.some(p => dist(p, pos) < 120));
      positions.push(pos);
      cells.push({ ...pos, collected: false, pulse: rand(0, Math.PI * 2) });
    }
  }

  function spawnHazards() {
    hazards = [];
    const count = 2 + difficulty;
    for (let i = 0; i < count; i++) {
      const angle = rand(0, Math.PI * 2);
      const speed = HAZARD_BASE_SPEED * (1 + difficulty * 0.4);
      const pos = randomArenaPos(MARGIN + 30);
      // Keep hazards away from player start
      if (dist(pos, player) < 150) {
        pos.x = pos.x < WORLD_W / 2 ? MARGIN + 30 : WORLD_W - MARGIN - 30;
        pos.y = pos.y < WORLD_H / 2 ? MARGIN + 30 : WORLD_H - MARGIN - 30;
      }
      hazards.push({
        x: pos.x,
        y: pos.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: HAZARD_RADIUS,
        angle: 0,
        type: i % 2  // 0 = diamond, 1 = circle variant
      });
    }
  }

  /* ── Particles ────────────────────────────── */
  function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = rand(0, Math.PI * 2);
      const speed = rand(60, 200);
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: rand(0.3, 0.8),
        maxLife: 0.8,
        color,
        radius: rand(2, 5)
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles(ctx) {
    for (const p of particles) {
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius * alpha, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  /* ── Collision ────────────────────────────── */
  function checkHazardCollision() {
    for (const h of hazards) {
      if (dist(player, h) < PLAYER_RADIUS + h.radius - 4) {
        return true;
      }
    }
    return false;
  }

  function checkCellCollection() {
    for (const c of cells) {
      if (c.collected) continue;
      if (dist(player, c) < PLAYER_RADIUS + CELL_RADIUS) {
        c.collected = true;
        collected++;
        difficulty = collected;
        spawnParticles(c.x, c.y, '#f5d742', 18);
        updateUI();
        if (collected >= CELLS_TOTAL) {
          win();
        } else {
          // Difficulty bump: replace hazards
          spawnHazards();
        }
        return;
      }
    }
  }

  /* ── Win / Lose ───────────────────────────── */
  function win() {
    phase = 'won';
    elapsed = Math.round(elapsed * 100) / 100;
    cancelAnimationFrame(animationId);
    animationId = null;
    updateUI();
    resultEl.textContent = 'DELIVERY COMPLETE — ' + elapsed.toFixed(1) + 's';
    resultEl.className = 'result-area win';
    startBtn.textContent = 'Restart';
    startBtn.focus();

    // Persist best time
    if (bestTime === null || elapsed < bestTime) {
      bestTime = elapsed;
      try { localStorage.setItem(STORAGE_KEY, String(elapsed)); } catch (_) {}
      updateBestDisplay();
    }
  }

  function lose() {
    phase = 'lost';
    cancelAnimationFrame(animationId);
    animationId = null;
    spawnParticles(player.x, player.y, '#f85c5c', 30);
    // Flash screen red in next render
    updateUI();
    resultEl.textContent = 'COURIER DESTROYED';
    resultEl.className = 'result-area lose';
    startBtn.textContent = 'Restart';
    startBtn.focus();
  }

  /* ── UI updates ──────────────────────────── */
  function updateUI() {
    scoreEl.textContent = collected;
    timerSpan.textContent = elapsed.toFixed(1);
  }

  function updateBestDisplay() {
    bestSpan.textContent = bestTime !== null ? bestTime.toFixed(1) : '--';
  }

  /* ── Reset ───────────────────────────────── */
  function reset() {
    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
    phase = 'idle';
    collected = 0;
    difficulty = 0;
    elapsed = 0;
    player.x = WORLD_W / 2;
    player.y = WORLD_H / 2;
    cells = [];
    hazards = [];
    particles = [];
    keys = {};
    pointerActive = false;
    lastTime = 0;
    spawnCells();
    spawnHazards();
    updateUI();
    resultEl.textContent = '';
    resultEl.className = 'result-area';
    startBtn.textContent = 'Start';
    // Draw idle frame
    renderFrame();
  }

  /* ── Start ───────────────────────────────── */
  function start() {
    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
    phase = 'playing';
    collected = 0;
    difficulty = 0;
    elapsed = 0;
    player.x = WORLD_W / 2;
    player.y = WORLD_H / 2;
    cells = [];
    hazards = [];
    particles = [];
    keys = {};
    pointerActive = false;
    lastTime = performance.now();
    spawnCells();
    spawnHazards();
    updateUI();
    resultEl.textContent = '';
    resultEl.className = 'result-area';
    startBtn.textContent = 'Restart';
    lastTime = performance.now();
    animationId = requestAnimationFrame(gameLoop);
  }

  /* ── Game loop ───────────────────────────── */
  function gameLoop(timestamp) {
    if (phase !== 'playing') return;

    const dt = Math.min((timestamp - lastTime) / 1000, 0.1); // cap at 100ms
    lastTime = timestamp;
    elapsed += dt;

    update(dt);
    render(timestamp);
    updateUI();
    animationId = requestAnimationFrame(gameLoop);
  }

  /* ── Update ──────────────────────────────── */
  function update(dt) {
    // Player movement
    let moveX = 0, moveY = 0;

    if (pointerActive) {
      const dx = pointerWorldX - player.x;
      const dy = pointerWorldY - player.y;
      const d = Math.hypot(dx, dy);
      if (d > 3) {
        const n = normalize(dx, dy);
        moveX = n.x;
        moveY = n.y;
      }
    }

    // Keyboard overrides pointer
    if (keys['ArrowLeft'] || keys['KeyA']) moveX = -1;
    if (keys['ArrowRight'] || keys['KeyD']) moveX = 1;
    if (keys['ArrowUp'] || keys['KeyW']) moveY = -1;
    if (keys['ArrowDown'] || keys['KeyS']) moveY = 1;

    // Normalize diagonal
    if (moveX !== 0 || moveY !== 0) {
      const n = normalize(moveX, moveY);
      player.x += n.x * PLAYER_SPEED * dt;
      player.y += n.y * PLAYER_SPEED * dt;
    }

    // Clamp to arena
    player.x = clamp(player.x, PLAYER_RADIUS, WORLD_W - PLAYER_RADIUS);
    player.y = clamp(player.y, PLAYER_RADIUS, WORLD_H - PLAYER_RADIUS);

    // Update hazards
    for (const h of hazards) {
      h.x += h.vx * dt;
      h.y += h.vy * dt;

      // Bounce off walls
      if (h.x - h.radius < 0) { h.x = h.radius; h.vx = Math.abs(h.vx); }
      if (h.x + h.radius > WORLD_W) { h.x = WORLD_W - h.radius; h.vx = -Math.abs(h.vx); }
      if (h.y - h.radius < 0) { h.y = h.radius; h.vy = Math.abs(h.vy); }
      if (h.y + h.radius > WORLD_H) { h.y = WORLD_H - h.radius; h.vy = -Math.abs(h.vy); }

      h.angle += dt * 3;
    }

    // Update particles
    updateParticles(dt);

    // Collision checks
    if (checkHazardCollision()) {
      lose();
      return;
    }
    checkCellCollection();
  }

  /* ── Render ──────────────────────────────── */
  function render(timestamp) {
    ctx.clearRect(0, 0, WORLD_W, WORLD_H);

    // Background
    const bgGrad = ctx.createRadialGradient(WORLD_W / 2, WORLD_H / 2, 50, WORLD_W / 2, WORLD_H / 2, 500);
    bgGrad.addColorStop(0, '#141430');
    bgGrad.addColorStop(1, '#080818');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);

    // Grid
    ctx.strokeStyle = 'rgba(60, 60, 120, 0.15)';
    ctx.lineWidth = 0.5;
    const gridSize = 40;
    for (let x = gridSize; x < WORLD_W; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, WORLD_H);
      ctx.stroke();
    }
    for (let y = gridSize; y < WORLD_H; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(WORLD_W, y);
      ctx.stroke();
    }

    // Stars
    for (const s of stars) {
      const twinkle = 0.5 + 0.5 * Math.sin(timestamp * 0.001 + s.twinkle);
      const alpha = s.brightness * twinkle;
      ctx.fillStyle = `rgba(200,210,255,${alpha.toFixed(2)})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Arena border glow
    ctx.strokeStyle = 'rgba(126, 200, 248, 0.2)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, WORLD_W - 2, WORLD_H - 2);

    // Energy cells
    for (const c of cells) {
      if (c.collected) continue;
      const pulse = 0.85 + 0.15 * Math.sin(timestamp * 0.004 + c.pulse);

      // Outer glow
      ctx.save();
      ctx.shadowColor = '#f5d742';
      ctx.shadowBlur = 20 * pulse;
      ctx.fillStyle = 'rgba(245, 215, 66, 0.15)';
      ctx.beginPath();
      ctx.arc(c.x, c.y, CELL_RADIUS + 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Middle glow
      ctx.save();
      ctx.shadowColor = '#f5a742';
      ctx.shadowBlur = 14;
      const cellGrad = ctx.createRadialGradient(c.x - 3, c.y - 3, 2, c.x, c.y, CELL_RADIUS);
      cellGrad.addColorStop(0, '#fff8d0');
      cellGrad.addColorStop(0.4, '#f5d742');
      cellGrad.addColorStop(1, '#c89420');
      ctx.fillStyle = cellGrad;
      ctx.beginPath();
      ctx.arc(c.x, c.y, CELL_RADIUS * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Inner highlight
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath();
      ctx.arc(c.x - 3, c.y - 4, CELL_RADIUS * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }

    // Hazards
    for (const h of hazards) {
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(h.angle);

      // Glow
      ctx.shadowColor = '#f85c5c';
      ctx.shadowBlur = 18;
      const hazardGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, h.radius);
      hazardGrad.addColorStop(0, '#ff6060');
      hazardGrad.addColorStop(0.5, '#d03030');
      hazardGrad.addColorStop(1, '#801010');
      ctx.fillStyle = hazardGrad;

      if (h.type === 0) {
        // Diamond shape
        ctx.beginPath();
        ctx.moveTo(0, -h.radius);
        ctx.lineTo(h.radius * 0.7, 0);
        ctx.lineTo(0, h.radius);
        ctx.lineTo(-h.radius * 0.7, 0);
        ctx.closePath();
        ctx.fill();
      } else {
        // Spiky circle
        ctx.beginPath();
        const spikes = 8;
        for (let i = 0; i < spikes * 2; i++) {
          const angle = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
          const r = i % 2 === 0 ? h.radius : h.radius * 0.65;
          const sx = Math.cos(angle) * r;
          const sy = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(sx, sy);
          else ctx.lineTo(sx, sy);
        }
        ctx.closePath();
        ctx.fill();
      }

      // Core
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ff8888';
      ctx.beginPath();
      ctx.arc(0, 0, h.radius * 0.35, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // Particles
    drawParticles(ctx);

    // Player
    ctx.save();
    ctx.translate(player.x, player.y);

    // Engine glow
    ctx.shadowColor = '#7ec8f8';
    ctx.shadowBlur = 22;
    const engineGlow = ctx.createRadialGradient(0, 0, 2, 0, 0, PLAYER_RADIUS + 6);
    engineGlow.addColorStop(0, 'rgba(126, 200, 248, 0.25)');
    engineGlow.addColorStop(1, 'rgba(126, 200, 248, 0)');
    ctx.fillStyle = engineGlow;
    ctx.beginPath();
    ctx.arc(0, 0, PLAYER_RADIUS + 6, 0, Math.PI * 2);
    ctx.fill();

    // Ship body (triangle pointing up / direction of movement)
    ctx.shadowBlur = 12;
    const shipGrad = ctx.createLinearGradient(0, -PLAYER_RADIUS, 0, PLAYER_RADIUS);
    shipGrad.addColorStop(0, '#b8e8ff');
    shipGrad.addColorStop(0.5, '#4aa8e0');
    shipGrad.addColorStop(1, '#1a5888');
    ctx.fillStyle = shipGrad;
    ctx.beginPath();
    ctx.moveTo(0, -PLAYER_RADIUS);
    ctx.lineTo(PLAYER_RADIUS * 0.85, PLAYER_RADIUS * 0.7);
    ctx.lineTo(0, PLAYER_RADIUS * 0.3);
    ctx.lineTo(-PLAYER_RADIUS * 0.85, PLAYER_RADIUS * 0.7);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#d0f0ff';
    ctx.beginPath();
    ctx.arc(0, -2, PLAYER_RADIUS * 0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // Win/loss overlays rendered in the render phase
    if (phase === 'lost') {
      ctx.fillStyle = 'rgba(200, 20, 20, 0.25)';
      ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    }
  }

  function renderFrame() {
    render(performance.now());
  }

  /* ── Input: Keyboard ──────────────────────── */
  window.addEventListener('keydown', function(e) {
    keys[e.code] = true;
    // Prevent scrolling with arrow keys
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
      e.preventDefault();
    }
    // Enter / Space to start
    if ((e.code === 'Enter' || e.code === 'Space') && phase !== 'playing') {
      e.preventDefault();
      handleStart();
    }
  });

  window.addEventListener('keyup', function(e) {
    keys[e.code] = false;
  });

  /* ── Input: Pointer / Touch ───────────────── */
  function getWorldCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = WORLD_W / rect.width;
    const scaleY = WORLD_H / rect.height;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  canvas.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    if (phase !== 'playing') return;
    pointerActive = true;
    const w = getWorldCoords(e.clientX, e.clientY);
    pointerWorldX = w.x;
    pointerWorldY = w.y;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', function(e) {
    if (!pointerActive) return;
    e.preventDefault();
    const w = getWorldCoords(e.clientX, e.clientY);
    pointerWorldX = w.x;
    pointerWorldY = w.y;
  });

  canvas.addEventListener('pointerup', function(e) {
    pointerActive = false;
  });

  canvas.addEventListener('pointerleave', function(e) {
    pointerActive = false;
  });

  canvas.addEventListener('pointercancel', function(e) {
    pointerActive = false;
  });

  /* ── Start button ─────────────────────────── */
  function handleStart() {
    if (phase === 'playing') {
      reset();
      // Small delay then start fresh
      setTimeout(start, 100);
    } else {
      start();
    }
  }

  startBtn.addEventListener('click', handleStart);

  /* ── Window resize ────────────────────────── */
  window.addEventListener('resize', function() {
    if (phase === 'idle' || phase === 'won' || phase === 'lost') {
      renderFrame();
    }
  });

  /* ── Benchmark adapter ────────────────────── */
  window.__benchmark = {
    start: function() {
      if (phase !== 'idle') reset();
      start();
      return this.getState();
    },

    act: function() {
      if (phase !== 'playing') return this.getState();
      // Move player toward nearest uncollected cell
      let nearest = null;
      let nearestDist = Infinity;
      for (const c of cells) {
        if (c.collected) continue;
        const d = dist(player, c);
        if (d < nearestDist) { nearestDist = d; nearest = c; }
      }
      if (nearest) {
        const n = normalize(nearest.x - player.x, nearest.y - player.y);
        player.x += n.x * 40;
        player.y += n.y * 40;
        player.x = clamp(player.x, PLAYER_RADIUS, WORLD_W - PLAYER_RADIUS);
        player.y = clamp(player.y, PLAYER_RADIUS, WORLD_H - PLAYER_RADIUS);
        // Check collection after moving
        checkCellCollection();
        updateUI();
        renderFrame();
      }
      return this.getState();
    },

    complete: function() {
      if (phase !== 'playing') return this.getState();
      // Collect all remaining cells through the real pathway
      for (const c of cells) {
        if (c.collected) continue;
        c.collected = true;
        collected++;
        difficulty = collected;
        spawnParticles(c.x, c.y, '#f5d742', 18);
      }
      if (collected >= CELLS_TOTAL) {
        win();
      }
      updateUI();
      renderFrame();
      return this.getState();
    },

    reset: function() {
      reset();
      return this.getState();
    },

    getState: function() {
      return {
        phase: phase,
        score: collected,
        progress: collected / CELLS_TOTAL,
        player: { x: Math.round(player.x), y: Math.round(player.y) }
      };
    }
  };

  /* ── Init ─────────────────────────────────── */
  spawnCells();
  spawnHazards();
  renderFrame();

})();
</script>
</body>
</html>
