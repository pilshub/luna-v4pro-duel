<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Stop</title>
<style>
  :root {
    --bg: #080c14;
    --surface: #111827;
    --border: #1e293b;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --cyan: #06b6d4;
    --cyan-glow: #22d3ee;
    --amber: #f59e0b;
    --amber-glow: #fbbf24;
    --green: #10b981;
    --red: #ef4444;
    --track-height: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(6,182,212,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(245,158,11,0.05) 0%, transparent 60%);
  }

  .game-container {
    width: min(640px, 92vw);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding: 20px 0;
  }

  /* Header */
  .header {
    text-align: center;
  }

  .title {
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, var(--cyan-glow), var(--amber-glow));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Scoreboard */
  .scoreboard {
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 20px;
    text-align: center;
    min-width: 80px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .score-card.highlight {
    border-color: var(--cyan);
    box-shadow: 0 0 20px rgba(6,182,212,0.15);
  }

  .score-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    margin-bottom: 2px;
  }

  .score-value {
    font-size: 1.8rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
  }

  .score-value.best {
    color: var(--amber-glow);
    font-size: 1.2rem;
  }

  .round-indicator {
    display: flex;
    gap: 8px;
  }

  .round-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s, box-shadow 0.3s;
  }

  .round-dot.active {
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan-glow);
  }

  .round-dot.done {
    background: var(--green);
  }

  .round-dot.missed {
    background: var(--red);
  }

  /* Track area */
  .track-wrapper {
    width: 100%;
    position: relative;
    padding: 32px 0 20px;
  }

  .track-label-left,
  .track-label-right {
    position: absolute;
    top: 6px;
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .track-label-left { left: 0; }
  .track-label-right { right: 0; }

  canvas#track-canvas {
    display: block;
    width: 100%;
    height: 80px;
    cursor: pointer;
    border-radius: 8px;
    outline: none;
  }

  canvas#track-canvas:focus-visible {
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--cyan-glow);
    border-radius: 8px;
  }

  /* Feedback overlay */
  .feedback {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 3rem;
    font-weight: 900;
    pointer-events: none;
    z-index: 10;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-shadow: 0 0 30px currentColor;
  }

  .feedback.show {
    transform: translate(-50%, -50%) scale(1);
  }

  .feedback.hit {
    color: var(--green);
    text-shadow: 0 0 40px var(--green);
  }

  .feedback.miss {
    color: var(--red);
    text-shadow: 0 0 40px var(--red);
  }

  /* Result screen */
  .result-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 32px;
    text-align: center;
    display: none;
    flex-direction: column;
    gap: 16px;
    animation: fadeIn 0.4s ease;
  }

  .result-panel.visible {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-title {
    font-size: 1.4rem;
    font-weight: 700;
  }

  .result-total {
    font-size: 3rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--cyan-glow), var(--amber-glow));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .result-detail {
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  .new-best {
    color: var(--amber);
    font-weight: 700;
    font-size: 0.9rem;
    animation: pulse 1s ease infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* Buttons */
  .btn {
    padding: 12px 36px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: all 0.2s;
    outline: none;
    position: relative;
  }

  .btn-start {
    background: linear-gradient(135deg, var(--cyan), #0891b2);
    color: #fff;
    box-shadow: 0 0 24px rgba(6,182,212,0.25);
  }

  .btn-start:hover {
    box-shadow: 0 0 36px rgba(6,182,212,0.4);
    transform: translateY(-1px);
  }

  .btn-start:focus-visible {
    box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--cyan);
  }

  .btn-start:active {
    transform: scale(0.97);
  }

  .btn-start:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .hint {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: -12px;
  }

  /* Mobile tweaks */
  @media (max-width: 420px) {
    .game-container { gap: 18px; padding: 12px 0; }
    .scoreboard { gap: 14px; }
    .score-card { padding: 8px 14px; min-width: 64px; }
    .score-value { font-size: 1.4rem; }
    .score-value.best { font-size: 1rem; }
    .feedback { font-size: 2.2rem; }
    .result-total { font-size: 2.4rem; }
  }
</style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <h1 class="title">Pulse Stop</h1>
    <p class="subtitle" id="round-label">Round 1 of 3</p>
  </div>

  <div class="scoreboard">
    <div class="score-card" id="score-card">
      <div class="score-label">Score</div>
      <div class="score-value" data-testid="score" id="score-display">0</div>
    </div>
    <div class="score-card">
      <div class="score-label">Best</div>
      <div class="score-value best" id="best-display">—</div>
    </div>
    <div class="round-indicator" id="round-dots">
      <div class="round-dot active"></div>
      <div class="round-dot"></div>
      <div class="round-dot"></div>
    </div>
  </div>

  <div class="track-wrapper" data-testid="stage">
    <span class="track-label-left">◀</span>
    <span class="track-label-right">▶</span>
    <canvas id="track-canvas" data-testid="primary-action" tabindex="0" role="button" aria-label="Stop the marker"></canvas>
  </div>

  <p class="hint" id="hint-text">Press <strong>Space</strong>, click/tap the track, or press the button to stop</p>

  <button class="btn btn-start" data-testid="start" id="start-btn">Start</button>

  <div class="result-panel" data-testid="result" id="result-panel">
    <div class="result-title" id="result-title"></div>
    <div class="result-total" id="result-total"></div>
    <div class="result-detail" id="result-detail"></div>
    <div class="new-best" id="new-best" style="display:none">★ New Best Score!</div>
    <button class="btn btn-start" id="restart-btn">Play Again</button>
  </div>
</div>

<div class="feedback" id="feedback-overlay"></div>

<script>
(function() {
  'use strict';

  // ─── DOM refs ────────────────────────────────
  const canvas = document.getElementById('track-canvas');
  const ctx = canvas.getContext('2d');
  const startBtn = document.getElementById('start-btn');
  const restartBtn = document.getElementById('restart-btn');
  const scoreDisplay = document.getElementById('score-display');
  const bestDisplay = document.getElementById('best-display');
  const roundLabel = document.getElementById('round-label');
  const roundDots = document.getElementById('round-dots');
  const resultPanel = document.getElementById('result-panel');
  const resultTitle = document.getElementById('result-title');
  const resultTotal = document.getElementById('result-total');
  const resultDetail = document.getElementById('result-detail');
  const newBestEl = document.getElementById('new-best');
  const feedbackOverlay = document.getElementById('feedback-overlay');
  const hintText = document.getElementById('hint-text');
  const scoreCard = document.getElementById('score-card');

  // ─── Constants ───────────────────────────────
  const TOTAL_ROUNDS = 3;
  const LS_KEY = 'bench.pulse-stop.best';
  const RESOLVE_DELAY = 900;   // ms to show feedback before next round
  const FINAL_DELAY = 600;     // ms before showing result panel after last round

  // Round config: [targetWidth, speedHz]
  const ROUND_CONFIG = [
    { targetWidth: 0.30, speedHz: 0.55 },  // Round 1: wide, slow
    { targetWidth: 0.20, speedHz: 0.90 },  // Round 2: medium
    { targetWidth: 0.10, speedHz: 1.50 },  // Round 3: narrow, fast
  ];

  // ─── State ───────────────────────────────────
  let phase = 'idle';          // idle | playing | resolving | completed
  let round = 1;
  let totalScore = 0;
  let roundScore = 0;
  let markerPosition = 0.5;
  let roundStartTime = 0;
  let animFrameId = null;
  let bestScore = null;
  let roundResults = [];       // per-round scores for result display
  let inputLocked = false;
  let completeResolver = null; // for adapter complete()
  let completePollFrame = null;

  // ─── Load best score ─────────────────────────
  try {
    const stored = localStorage.getItem(LS_KEY);
    if (stored !== null) {
      const val = parseInt(stored, 10);
      if (!isNaN(val) && val >= 0 && val <= TOTAL_ROUNDS * 100) {
        bestScore = val;
      }
    }
  } catch (_) { /* ignore */ }

  function updateBestDisplay() {
    bestDisplay.textContent = bestScore !== null ? String(bestScore) : '\u2014';
  }

  function saveBest(score) {
    if (bestScore === null || score > bestScore) {
      bestScore = score;
      try { localStorage.setItem(LS_KEY, String(score)); } catch (_) {}
      return true;
    }
    return false;
  }

  // ─── Canvas drawing ──────────────────────────
  function getCanvasPixelWidth() {
    return canvas.clientWidth || canvas.width;
  }

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = rect.width;
    const h = 80;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvas.style.height = h + 'px';
  }

  function drawFrame() {
    const w = getCanvasPixelWidth();
    const h = 80;
    const trackY = h / 2;
    const trackW = w - 40;
    const trackX = 20;
    const trackH = 10;
    const trackRadius = trackH / 2;

    ctx.clearRect(0, 0, w, h);

    // Track background
    ctx.fillStyle = '#1a1f2e';
    ctx.beginPath();
    ctx.roundRect(trackX, trackY - trackH / 2, trackW, trackH, trackRadius);
    ctx.fill();

    // Track inner shadow (subtle)
    ctx.strokeStyle = '#2d3548';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(trackX, trackY - trackH / 2, trackW, trackH, trackRadius);
    ctx.stroke();

    // Target zone
    if (phase === 'playing' || phase === 'resolving') {
      const cfg = ROUND_CONFIG[round - 1];
      const targetCenter = 0.5;
      const halfWidth = cfg.targetWidth / 2;
      const tzLeft = trackX + (targetCenter - halfWidth) * trackW;
      const tzRight = trackX + (targetCenter + halfWidth) * trackW;

      // Zone glow
      const glowGrad = ctx.createLinearGradient(tzLeft, 0, tzRight, 0);
      glowGrad.addColorStop(0, 'rgba(245,158,11,0)');
      glowGrad.addColorStop(0.3, 'rgba(245,158,11,0.25)');
      glowGrad.addColorStop(0.5, 'rgba(245,158,11,0.35)');
      glowGrad.addColorStop(0.7, 'rgba(245,158,11,0.25)');
      glowGrad.addColorStop(1, 'rgba(245,158,11,0)');
      ctx.fillStyle = glowGrad;
      ctx.fillRect(tzLeft - 20, trackY - 22, tzRight - tzLeft + 40, 44);

      // Zone bar
      ctx.fillStyle = 'rgba(245,158,11,0.4)';
      ctx.beginPath();
      ctx.roundRect(tzLeft, trackY - trackH / 2 + 1, tzRight - tzLeft, trackH - 2, trackRadius);
      ctx.fill();

      // Zone border
      ctx.strokeStyle = 'rgba(251,191,36,0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(tzLeft, trackY - trackH / 2 + 1, tzRight - tzLeft, trackH - 2, trackRadius);
      ctx.stroke();

      // Zone brackets
      const bracketH = 16;
      ctx.strokeStyle = 'rgba(251,191,36,0.8)';
      ctx.lineWidth = 2;
      // Left bracket
      ctx.beginPath();
      ctx.moveTo(tzLeft, trackY - trackH / 2 - 2);
      ctx.lineTo(tzLeft, trackY - trackH / 2 - bracketH);
      ctx.moveTo(tzLeft - 6, trackY - trackH / 2 - bracketH);
      ctx.lineTo(tzLeft + 6, trackY - trackH / 2 - bracketH);
      ctx.stroke();
      // Right bracket
      ctx.beginPath();
      ctx.moveTo(tzRight, trackY - trackH / 2 - 2);
      ctx.lineTo(tzRight, trackY - trackH / 2 - bracketH);
      ctx.moveTo(tzRight - 6, trackY - trackH / 2 - bracketH);
      ctx.lineTo(tzRight + 6, trackY - trackH / 2 - bracketH);
      ctx.stroke();
    }

    // Marker
    if (phase === 'playing' || phase === 'resolving') {
      const mx = trackX + markerPosition * trackW;
      const clampedMx = Math.max(trackX, Math.min(trackX + trackW, mx));

      // Trail
      const trailCount = 8;
      const cfg = ROUND_CONFIG[round - 1];
      const speed = cfg.speedHz;
      for (let i = trailCount; i >= 1; i--) {
        const alpha = 0.06 * (1 - i / trailCount);
        const offset = (i / trailCount) * 18 * Math.min(speed / 0.55, 1.8);
        const trailX = clampedMx - offset;
        ctx.fillStyle = `rgba(6,182,212,${alpha})`;
        ctx.fillRect(trailX - 3, trackY - 16, 6, 32);
      }

      // Main marker glow
      const glowGrad2 = ctx.createRadialGradient(clampedMx, trackY, 2, clampedMx, trackY, 18);
      glowGrad2.addColorStop(0, 'rgba(34,211,238,0.9)');
      glowGrad2.addColorStop(0.4, 'rgba(6,182,212,0.4)');
      glowGrad2.addColorStop(1, 'rgba(6,182,212,0)');
      ctx.fillStyle = glowGrad2;
      ctx.fillRect(clampedMx - 18, trackY - 18, 36, 36);

      // Marker bar
      ctx.fillStyle = '#e0f7ff';
      ctx.shadowColor = '#22d3ee';
      ctx.shadowBlur = 14;
      ctx.fillRect(clampedMx - 2.5, trackY - 15, 5, 30);
      ctx.shadowBlur = 0;
    }
  }

  // ─── Animation loop ──────────────────────────
  function animate(timestamp) {
    if (phase === 'playing') {
      const elapsed = (timestamp - roundStartTime) / 1000;
      const cfg = ROUND_CONFIG[round - 1];
      markerPosition = 0.5 + 0.5 * Math.sin(elapsed * Math.PI * 2 * cfg.speedHz);
    }
    drawFrame();
    animFrameId = requestAnimationFrame(animate);
  }

  function startAnimation() {
    if (animFrameId) cancelAnimationFrame(animFrameId);
    animFrameId = requestAnimationFrame(animate);
  }

  // ─── Game logic ──────────────────────────────
  function isInTargetZone() {
    const cfg = ROUND_CONFIG[round - 1];
    const targetCenter = 0.5;
    const halfWidth = cfg.targetWidth / 2;
    return Math.abs(markerPosition - targetCenter) <= halfWidth;
  }

  function getAccuracy() {
    const cfg = ROUND_CONFIG[round - 1];
    const targetCenter = 0.5;
    const halfWidth = cfg.targetWidth / 2;
    const dist = Math.abs(markerPosition - targetCenter);
    if (dist > halfWidth) return 0;
    // 100 at center, 0 at edge
    return Math.round(100 * (1 - dist / halfWidth));
  }

  function showFeedback(type, score) {
    const el = feedbackOverlay;
    el.className = 'feedback';
    if (type === 'hit') {
      el.classList.add('hit');
      el.textContent = score > 0 ? String(score) : 'HIT';
    } else {
      el.classList.add('miss');
      el.textContent = 'MISS';
    }
    // Force reflow
    void el.offsetWidth;
    el.classList.add('show');
    setTimeout(() => { el.classList.remove('show'); }, 600);
  }

  function updateUI() {
    scoreDisplay.textContent = String(totalScore);
    roundLabel.textContent = `Round ${round} of ${TOTAL_ROUNDS}`;
    scoreCard.classList.toggle('highlight', phase === 'playing');

    // Round dots
    const dots = roundDots.children;
    for (let i = 0; i < TOTAL_ROUNDS; i++) {
      dots[i].className = 'round-dot';
      if (i < round - 1) {
        dots[i].classList.add(roundResults[i] > 0 ? 'done' : 'missed');
      } else if (i === round - 1 && (phase === 'playing' || phase === 'resolving')) {
        dots[i].classList.add('active');
      }
    }

    // Start button
    if (phase === 'idle') {
      startBtn.style.display = '';
      startBtn.textContent = 'Start';
      startBtn.disabled = false;
    } else if (phase === 'playing') {
      startBtn.style.display = 'none';
    } else if (phase === 'resolving') {
      startBtn.style.display = 'none';
    } else if (phase === 'completed') {
      startBtn.style.display = 'none';
    }

    // Hint
    hintText.style.display = phase === 'playing' ? '' : 'none';

    // Result panel
    if (phase === 'completed') {
      resultPanel.classList.add('visible');
    } else {
      resultPanel.classList.remove('visible');
    }

    // Round label
    roundLabel.style.display = phase === 'completed' ? 'none' : '';
  }

  function resolveStop() {
    inputLocked = true;
    phase = 'resolving';

    const acc = getAccuracy();
    roundScore = acc;
    totalScore += acc;
    roundResults.push(acc);

    const hit = acc > 0;
    showFeedback(hit ? 'hit' : 'miss', acc);
    updateUI();
    drawFrame();

    const isLastRound = round >= TOTAL_ROUNDS;

    setTimeout(() => {
      if (isLastRound) {
        finishGame();
      } else {
        round++;
        startRound();
      }
    }, RESOLVE_DELAY);
  }

  function startRound() {
    phase = 'playing';
    inputLocked = false;
    markerPosition = 0.5;
    roundStartTime = performance.now();
    updateUI();
  }

  function finishGame() {
    phase = 'completed';
    inputLocked = true;
    const isNewBest = saveBest(totalScore);
    updateBestDisplay();
    updateUI();
    drawFrame();

    // Build result
    const maxPossible = TOTAL_ROUNDS * 100;
    if (totalScore >= maxPossible * 0.9) {
      resultTitle.textContent = '\u2728 Perfect Run!';
    } else if (totalScore >= maxPossible * 0.5) {
      resultTitle.textContent = 'Well Done!';
    } else {
      resultTitle.textContent = 'Round Complete';
    }
    resultTotal.textContent = String(totalScore);
    resultDetail.textContent = `Rounds: ${roundResults.join(' + ')}`;
    if (isNewBest) {
      newBestEl.style.display = '';
    } else {
      newBestEl.style.display = 'none';
    }
  }

  function stopMarker() {
    if (phase !== 'playing' || inputLocked) return;
    resolveStop();
  }

  function startGame() {
    if (phase === 'playing' || phase === 'resolving') return;

    // Full reset
    phase = 'idle';
    round = 1;
    totalScore = 0;
    roundScore = 0;
    roundResults = [];
    markerPosition = 0.5;
    inputLocked = false;
    updateBestDisplay();
    updateUI();
    drawFrame();

    // Start first round
    phase = 'playing';
    roundStartTime = performance.now();
    updateUI();

    // Focus canvas for keyboard
    canvas.focus();
  }

  function resetGame() {
    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
    if (completePollFrame) {
      cancelAnimationFrame(completePollFrame);
      completePollFrame = null;
    }
    completeResolver = null;
    phase = 'idle';
    round = 1;
    totalScore = 0;
    roundScore = 0;
    roundResults = [];
    markerPosition = 0.5;
    inputLocked = false;
    roundStartTime = 0;
    updateBestDisplay();
    updateUI();
    feedbackOverlay.className = 'feedback';
    startAnimation();
  }

  // ─── Event handlers ──────────────────────────
  function handleAct() {
    stopMarker();
  }

  startBtn.addEventListener('click', (e) => {
    e.preventDefault();
    startGame();
  });

  restartBtn.addEventListener('click', (e) => {
    e.preventDefault();
    resetGame();
    startGame();
  });

  canvas.addEventListener('click', (e) => {
    e.preventDefault();
    handleAct();
  });

  canvas.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      e.stopPropagation();
      handleAct();
    } else if (e.code === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      if (phase === 'idle') startGame();
      else if (phase === 'completed') { resetGame(); startGame(); }
      else handleAct();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ') {
      // Only if not in an input
      if (e.target === document.body || e.target === canvas || e.target === startBtn || e.target === restartBtn) {
        e.preventDefault();
        if (phase === 'idle') startGame();
        else if (phase === 'completed') { resetGame(); startGame(); }
        else handleAct();
      }
    }
  });

  // Touch: prevent double-firing
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleAct();
  });

  // Resize handling
  window.addEventListener('resize', () => {
    resizeCanvas();
    drawFrame();
  });

  // ─── Adapter ─────────────────────────────────
  function waitForPhase(targetPhase, timeout = 8000) {
    return new Promise((resolve, reject) => {
      const start = performance.now();
      function check() {
        if (phase === targetPhase) {
          resolve();
        } else if (performance.now() - start > timeout) {
          reject(new Error(`Timeout waiting for phase "${targetPhase}"`));
        } else {
          requestAnimationFrame(check);
        }
      }
      check();
    });
  }

  function waitForTargetZone(timeout = 15000) {
    return new Promise((resolve, reject) => {
      const start = performance.now();
      function check() {
        if (phase !== 'playing') {
          // Phase changed (e.g., already resolved), resolve anyway
          resolve();
        } else if (isInTargetZone()) {
          resolve();
        } else if (performance.now() - start > timeout) {
          reject(new Error('Timeout waiting for marker in target zone'));
        } else {
          requestAnimationFrame(check);
        }
      }
      check();
    });
  }

  window.__benchmark = {
    start() {
      if (phase === 'idle') {
        startGame();
      }
    },

    act() {
      handleAct();
    },

    async complete() {
      if (phase === 'completed') return;
      if (phase === 'idle') {
        this.start();
        await new Promise(r => setTimeout(r, 80));
      }

      while (phase !== 'completed') {
        if (phase === 'playing') {
          try { await waitForTargetZone(15000); } catch (_) {}
          if (phase === 'playing') {
            this.act();
          }
          await new Promise(r => setTimeout(r, RESOLVE_DELAY + 120));
        } else if (phase === 'resolving') {
          await new Promise(r => setTimeout(r, 80));
        } else if (phase === 'idle') {
          this.start();
          await new Promise(r => setTimeout(r, 80));
        } else {
          break;
        }
      }
    },

    reset() {
      resetGame();
    },

    getState() {
      return {
        phase: phase,
        score: totalScore,
        progress: {
          round: round,
          roundResults: [...roundResults],
          totalRounds: TOTAL_ROUNDS,
        },
      };
    },
  };

  // ─── Init ────────────────────────────────────
  function init() {
    resizeCanvas();
    updateBestDisplay();
    updateUI();
    drawFrame();
    startAnimation();
    canvas.setAttribute('tabindex', '0');
  }

  // Polyfill roundRect if needed
  if (!ctx.roundRect) {
    ctx.roundRect = function(x, y, w, h, r) {
      if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
      ctx.beginPath();
      ctx.moveTo(x + r.tl, y);
      ctx.lineTo(x + w - r.tr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
      ctx.lineTo(x + w, y + h - r.br);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
      ctx.lineTo(x + r.bl, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
      ctx.lineTo(x, y + r.tl);
      ctx.quadraticCurveTo(x, y, x + r.tl, y);
      ctx.closePath();
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
